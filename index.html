<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0e5a7a">
<title>Word Explorer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: one-screen tablet app on a daylight sea. Home is a stepping-stone path to a treasure chest; quiz is one focused card; the cat lives in its own room. Committed single look. */
:root{
  --sea:#0b5d7a; --sea-2:#118bb0; --sea-3:#7fd3e6;
  --paper:#f6fbff; --ink:#123247; --ink-soft:#4b6a7f;
  --sun:#ffc23a; --coral:#ff6a55; --leaf:#2fae6b; --berry:#7a4dff;
  --line:#d5e6f0; --soft:#e7f3fa;
  --bronze:#c98a4b; --silver:#a9b6c2; --gold:#f2b51d;
  --display:"Fredoka","Baloo 2","Arial Rounded MT Bold",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;color:var(--ink);font-family:var(--body);font-size:18px;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;overflow:hidden;
  background:radial-gradient(1200px 500px at 15% -10%, rgba(127,211,230,.45), transparent 60%),radial-gradient(900px 600px at 110% 110%, rgba(17,139,176,.6), transparent 60%),repeating-radial-gradient(circle at 30% 120%, rgba(255,255,255,.05) 0 2px, transparent 2px 38px),var(--sea)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
button:focus-visible{outline:4px solid var(--sun);outline-offset:3px}
button:disabled{cursor:default}
.app{height:100%;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;box-sizing:border-box;max-width:1400px;margin:0 auto}
.screen{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px}
.panel{background:var(--paper);border-radius:28px;padding:clamp(16px,2.2vw,26px);flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:14px}

/* top bar */
.top{display:flex;align-items:center;gap:10px;color:#fff;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;padding:4px 10px 4px 4px;border-radius:999px;touch-action:none}
.logo .comp{width:50px;height:50px;border-radius:50%;background:var(--sun);display:grid;place-items:center;font-size:28px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.15)}
.logo h1{font-family:var(--display);font-weight:700;font-size:26px;margin:0;line-height:1}
.logo small{display:block;font-size:13px;opacity:.85;margin-top:3px}
.spacer{flex:1}
.pill{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.16);border-radius:999px;padding:8px 16px;font-family:var(--display);font-weight:600;font-size:24px;color:#fff;font-variant-numeric:tabular-nums}
.pill.coin{background:var(--sun);color:var(--ink);box-shadow:0 4px 0 #c9921a}
.pill.coin.bump{animation:bump .3s}
@keyframes bump{50%{transform:scale(1.18)}}
.navb{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.18);border-radius:999px;padding:8px 16px 8px 10px;font-family:var(--display);font-weight:600;font-size:20px;color:#fff;min-height:48px}
.navb .i{font-size:28px}
.navb.on{background:#fff;color:var(--ink)}

/* common bits */
.tag{font-family:var(--display);font-weight:600;font-size:16px;letter-spacing:.4px;text-transform:uppercase;background:var(--soft);color:var(--sea);padding:6px 12px;border-radius:999px}
.tag.ko,.ko{text-transform:none;letter-spacing:0;background:#fff3d1;color:#8a5a00}
.ko{border-radius:10px;padding:2px 10px;font-size:18px;font-weight:700;font-family:var(--body)}
.speak{flex:none;width:62px;height:62px;border-radius:50%;background:var(--sea-2);color:#fff;font-size:28px;display:grid;place-items:center;box-shadow:0 4px 0 #0a6b8a}
.speak:active{transform:translateY(3px);box-shadow:0 1px 0 #0a6b8a}
.sm{width:46px;height:46px;border-radius:50%;background:var(--soft);font-size:20px;display:grid;place-items:center;flex:none}
.big-btn{background:var(--coral);color:#fff;font-family:var(--display);font-weight:700;font-size:clamp(24px,2.6vw,32px);border-radius:22px;padding:18px 28px;box-shadow:0 6px 0 #c84636;display:inline-flex;align-items:center;justify-content:center;gap:10px}
.big-btn:active{transform:translateY(4px);box-shadow:0 2px 0 #c84636}
.big-btn.green{background:var(--leaf);box-shadow:0 6px 0 #1f7d4b}
.big-btn.blue{background:var(--sea-2);box-shadow:0 6px 0 #0a6b8a}
.big-btn.yellow{background:var(--sun);color:var(--ink);box-shadow:0 6px 0 #c9921a}
.big-btn.ghost{background:var(--soft);color:var(--ink);box-shadow:0 6px 0 var(--line)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}

/* ---------- path (home) ---------- */
.home{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;flex:1;min-height:0}
.pathcard{background:var(--paper);border-radius:28px;padding:18px clamp(16px,2vw,26px);display:flex;flex-direction:column;gap:10px;min-height:0;overflow:auto}
.pathhead{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.pathhead h2{font-family:var(--display);font-size:clamp(26px,3vw,36px);margin:0;line-height:1.1}
.left{font-family:var(--display);font-weight:700;font-size:clamp(20px,2.2vw,26px);background:#ffecea;color:#b2321f;border-radius:999px;padding:8px 18px}
.left.done{background:#e6f8ee;color:#1f7d4b}
.path{position:relative;height:clamp(250px,25vw,330px);margin-top:4px;flex:none}
.path svg.trail{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.stone{z-index:1}
.stone{position:absolute;transform:translate(-50%,-50%);width:clamp(108px,11.5vw,150px);display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.stone .rock{width:100%;aspect-ratio:1.25;border-radius:50% 50% 46% 46%/58% 58% 42% 42%;background:#cfdce4;display:grid;place-items:center;font-size:clamp(40px,4.4vw,56px);box-shadow:0 8px 0 #a9bcc8;position:relative}
.stone b{font-family:var(--display);font-size:clamp(15px,1.5vw,19px);line-height:1.1}
.stone small{font-size:13px;color:var(--ink-soft)}
.stone .rw{position:absolute;top:-12px;right:-10px;background:var(--sun);color:var(--ink);border-radius:999px;padding:3px 9px;font-family:var(--display);font-weight:700;font-size:16px;box-shadow:0 3px 0 #c9921a}
.stone.lock{filter:grayscale(.85)}
.stone.lock .rock{background:#e6edf1;box-shadow:0 8px 0 #cfdbe2}
.stone.lock .ic{opacity:.45}
.stone.lock .rw{opacity:.6}
.stone.lock b,.stone.lock small{color:#9aabb5}
.stone b,.stone small{background:var(--paper);border-radius:8px;padding:0 6px}
.stone.cur b{margin-top:16px}
.lmhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:17px}
.lmbar{flex:none;min-width:120px;height:14px;border-radius:999px;background:#d6e4ec;overflow:hidden}.lmbar i{display:block;height:100%;background:var(--leaf);border-radius:999px}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.lc{position:relative;border:0;border-radius:18px;background:#e6edf1;padding:12px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;font-size:15px}
.lc .ln{font-size:13px;font-weight:700;color:#6b7f8a}.lc .le{font-size:40px;line-height:1.1}.lc b{font-family:var(--display);font-size:17px;line-height:1.15}.lc small{font-size:13px;color:var(--ink-soft)}
.lc.done{background:#c9f0da}.lc.now{background:#fff;box-shadow:0 0 0 4px var(--coral)}.lc.lock .le,.lc.lock b{opacity:.5}
.ld{position:relative;aspect-ratio:1;border-radius:14px;border:0;background:#dfe8ee;display:grid;place-items:center;font-size:clamp(18px,2.2vw,26px);max-height:64px}
.ld .ln{position:absolute;top:2px;left:6px;font-size:12px;font-weight:700;color:#6b7f8a}
.ld.done{background:#bfe9d1;color:#1f7d4b;font-weight:700}
.ld.now{background:#fff;box-shadow:0 0 0 3px var(--coral);animation:glow 1.4s infinite}
.ld.lock .le{opacity:.45;filter:grayscale(.6)}
.stone small{white-space:nowrap}
@media (orientation:portrait) and (min-width:700px){ .path{height:clamp(300px,42vw,370px)} .stone{width:clamp(100px,14vw,132px)} .stone .rock{font-size:46px} .stone b{font-size:16px} }
.stone.done .rock{background:#bfe9d1;box-shadow:0 8px 0 #7cc79f}
.stone.done .rock::after{content:"✓";position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);background:var(--leaf);color:#fff;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:22px;font-weight:700}
.stone.done .rw{background:#e6f8ee;color:#1f7d4b;box-shadow:none}
.stone.cur .rock{background:#fff;box-shadow:0 8px 0 var(--coral),0 0 0 6px rgba(255,106,85,.25);animation:glow 1.4s infinite}
.stone.cur .go{position:absolute;bottom:-14px;left:50%;transform:translateX(-50%);background:var(--coral);color:#fff;border-radius:999px;padding:4px 14px;font-family:var(--display);font-weight:700;font-size:18px;white-space:nowrap}
@keyframes glow{50%{box-shadow:0 8px 0 var(--coral),0 0 0 14px rgba(255,106,85,.12)}}
.chest .rock{background:#ffe9b0;box-shadow:0 8px 0 #e0b143;font-size:clamp(48px,5.4vw,70px)}
.chest.ready .rock{animation:wiggle 1s infinite;background:#fff3d1}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
.pathcat{position:absolute;transform:translate(-50%,-100%);transition:left .9s cubic-bezier(.5,0,.5,1),top .9s cubic-bezier(.5,0,.5,1);z-index:3;pointer-events:none}
.pathcat.jumping .catw{animation:arc .9s ease-in-out}
@keyframes arc{0%{transform:translateY(0)}45%{transform:translateY(-70px) rotate(-8deg)}100%{transform:translateY(0)}}
.todaycards{display:flex;gap:10px;flex-wrap:wrap}
.cardsnote{display:flex;align-items:center;gap:10px;flex-wrap:wrap;color:var(--ink-soft);font-size:16px}

/* puzzle card */
.pz{position:relative;width:96px;height:120px;border-radius:16px;background:#fff;border:4px solid var(--line);overflow:hidden;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.pz .e{font-size:44px;line-height:1}
.pz .w{font-family:var(--display);font-weight:600;font-size:16px;text-align:center;line-height:1.05;padding:0 4px;overflow-wrap:anywhere}
.pz .cov{position:absolute;width:50%;height:50%;background:linear-gradient(135deg,#2a9cc0,#0f6f8f);display:grid;place-items:center;color:rgba(255,255,255,.55);font-family:var(--display);font-weight:700;font-size:22px;transition:transform .5s,opacity .5s;box-shadow:inset 0 0 0 2px rgba(255,255,255,.35)}
.pz .c0{top:0;left:0}.pz .c1{top:0;left:50%}.pz .c2{top:50%;left:0}.pz .c3{top:50%;left:50%}
.pz .cov.off{opacity:0;transform:scale(.3) rotate(25deg)}
.pz .badge{position:absolute;top:3px;right:4px;font-size:15px;z-index:2}
.pz.new{border-color:var(--sea-3)}
.t0{border-color:var(--bronze)!important}.t1{border-color:var(--silver)!important}.t2{border-color:var(--gold)!important}
.t3{border-color:transparent!important;background:linear-gradient(#fff,#fff) padding-box,linear-gradient(120deg,#ff5d8f,#ffc23a,#2fae6b,#118bb0,#7a4dff) border-box!important}

/* ---------- quiz ---------- */
.qtop{display:flex;align-items:center;gap:12px;color:#fff}
.iconbtn{width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.18);font-size:26px;display:grid;place-items:center;color:#fff;flex:none}
.prog{flex:1;height:18px;background:rgba(255,255,255,.2);border-radius:999px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--sun);border-radius:999px;transition:width .3s}
.qlabel{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.stage{flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px;min-height:0}
.prompt{display:flex;align-items:center;gap:14px}
.prompt .txt{font-family:var(--display);font-weight:500;font-size:clamp(24px,2.8vw,34px);line-height:1.3;flex:1;min-width:0}
.prompt .txt em{font-style:normal;color:var(--coral);font-weight:700}
.prompt .txt.sent{font-size:clamp(28px,3.4vw,42px);line-height:1.5}
.bigword{font-family:var(--display);font-weight:700;font-size:clamp(52px,7vw,84px);line-height:1}
.blank{display:inline-block;min-width:3.5em;border-bottom:4px solid var(--sea-2);margin:0 .15em;text-align:center;color:var(--leaf);font-weight:700}
.def{font-size:clamp(22px,2.4vw,28px);line-height:1.4;display:flex;align-items:center;gap:10px}
.hint{background:#fff3d1;color:#8a5a00;border-radius:999px;padding:8px 16px;font-weight:700;font-size:17px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.opts.emo{grid-template-columns:repeat(4,1fr)}
.kopic{display:inline-block;font-family:var(--body);font-weight:800;font-size:clamp(15px,.32em,22px);line-height:1.2;color:#5b4a8a;background:#f1ecff;border-radius:12px;padding:6px 8px;max-width:9em;word-break:keep-all;text-align:center}
.opts.one{grid-template-columns:1fr}
.opts.dm .opt{min-height:58px;padding-top:8px;padding-bottom:8px}
.panel>.qlabel,.panel>.stage,.panel>.opts,.panel>#fbwrap{flex-shrink:0}
.opt{position:relative;background:#fff;border:3px solid var(--line);border-radius:22px;min-height:84px;padding:12px 70px 12px 22px;font-family:var(--display);font-weight:600;font-size:clamp(22px,2.5vw,30px);text-align:left;display:flex;align-items:center;box-shadow:0 4px 0 var(--line)}
.opts.one .opt{font-size:clamp(20px,2.2vw,26px);font-weight:500;min-height:72px}
.opt:active{transform:translateY(3px)}
.opts.emo .opt{justify-content:center;padding:10px;font-size:clamp(56px,6.5vw,80px);min-height:130px}
.opt .os{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:50px;height:50px;border-radius:50%;background:var(--soft);font-size:22px;display:grid;place-items:center}
.opt.right{border-color:var(--leaf);background:#e6f8ee;box-shadow:0 4px 0 var(--leaf)}
.opt.wrong{border-color:var(--coral);background:#ffecea;box-shadow:0 4px 0 var(--coral);animation:shake .35s}
.opt.dim{opacity:.4}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.fb{display:flex;align-items:center;gap:14px;border-radius:20px;padding:12px 16px;font-size:19px}
.fb.good{background:#e6f8ee}.fb.bad{background:#fff1e3}
.fb .em{font-size:54px;line-height:1}
.fb .big{font-family:var(--display);font-weight:700;font-size:26px}
.fb .msg{flex:1;min-width:0}
.defs{margin-top:8px;display:grid;gap:6px}
.drow{display:flex;gap:8px;align-items:flex-start;background:rgba(255,255,255,.7);border-radius:12px;padding:6px 10px}
.drow b{font-size:20px}.dd{font-size:18px;color:var(--ink-soft)}
.dtag{font-size:14px;background:#fff3c4;border-radius:8px;padding:1px 6px;margin-left:4px}
.next{background:var(--sea-2);color:#fff;font-family:var(--display);font-weight:700;font-size:26px;border-radius:20px;padding:16px 28px;box-shadow:0 5px 0 #0a6b8a;flex:none}
.next:active{transform:translateY(3px);box-shadow:0 2px 0 #0a6b8a}

/* story */
.story{display:flex;flex-direction:column;gap:12px;max-width:980px}
.story h2{font-family:var(--display);font-size:clamp(28px,3vw,38px);margin:0}
.sline{display:flex;align-items:flex-start;gap:12px;font-size:clamp(22px,2.4vw,28px);line-height:1.5}
.sline .sm{margin-top:2px}
.sline mark{background:#fff3d1;color:inherit;border-radius:6px;padding:0 4px;font-weight:700}

/* round result */
.score{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;justify-content:center;flex:1}
.score .num{font-family:var(--display);font-weight:700;font-size:clamp(60px,8vw,96px);line-height:1}
.score .num small{font-size:.45em;color:var(--ink-soft)}
.score h2{font-family:var(--display);font-size:clamp(26px,3vw,36px);margin:0}
.wlist{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.wlist span{background:#ffecea;border-radius:999px;padding:6px 14px;font-family:var(--display);font-weight:600;font-size:20px}

/* coin burst */
.burst{position:fixed;inset:0;z-index:40;pointer-events:none;display:grid;place-items:center}
.burst .amt{font-family:var(--display);font-weight:700;font-size:clamp(70px,10vw,120px);color:var(--sun);text-shadow:0 6px 0 #c9921a,0 0 30px rgba(255,194,58,.6);animation:pop .6s both}
.burst .cn{position:fixed;font-size:44px;transition:transform .9s cubic-bezier(.6,-0.2,.7,1),opacity .9s}
@keyframes pop{0%{transform:scale(.2);opacity:0}60%{transform:scale(1.2);opacity:1}100%{transform:scale(1)}}

/* card book */
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.tab{flex:none;background:rgba(255,255,255,.18);color:#fff;border-radius:999px;padding:10px 18px;font-family:var(--display);font-weight:600;font-size:20px;display:flex;align-items:center;gap:8px}
.tab.on{background:#fff;color:var(--ink)}
.bookhead{display:flex;align-items:center;gap:14px;flex-wrap:wrap;color:#fff;font-family:var(--display);font-size:20px}
.bookhead b{font-size:28px}
.scroll{overflow-y:auto;min-height:0;flex:1;padding-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(116px,1fr));gap:12px}
.card{position:relative;background:#fff;border-radius:18px;padding:12px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;border:4px solid var(--line);min-height:124px;box-sizing:border-box}
.card .e{font-size:48px;line-height:1.1}
.card .w{font-family:var(--display);font-weight:600;font-size:18px;overflow-wrap:anywhere;text-align:center;line-height:1.1}
.card .st{position:absolute;top:4px;right:6px;font-size:16px}
.card.unk{background:rgba(255,255,255,.55);border-style:dashed;border-color:rgba(255,255,255,.7)}
.card.unk .e{filter:brightness(0);opacity:.18}
.card.unk .w{color:rgba(18,50,71,.45)}
.card.t3::after{content:"";position:absolute;inset:0;border-radius:14px;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.85) 45%,transparent 60%);background-size:250% 100%;animation:shine 3s infinite;pointer-events:none}
@keyframes shine{0%{background-position:150% 0}60%,100%{background-position:-100% 0}}
.legend{display:flex;gap:10px;flex-wrap:wrap;align-items:center;color:#fff;font-size:15px}
.legend i{display:inline-block;width:18px;height:18px;border-radius:5px;border:4px solid;vertical-align:-5px;margin-right:4px;background:#fff}

/* modal */
.modal{position:fixed;inset:0;background:rgba(6,40,56,.6);display:grid;place-items:center;padding:16px;z-index:30}
.sheet{background:var(--paper);border-radius:28px;padding:24px;width:min(900px,100%);max-height:calc(100% - 32px);overflow:auto;display:flex;flex-direction:column;gap:14px;box-sizing:border-box;position:relative}
.sheet .close{position:absolute;top:14px;right:14px;width:56px;height:56px;border-radius:50%;background:var(--soft);font-size:26px;display:grid;place-items:center;z-index:2}
.detail{display:grid;grid-template-columns:auto minmax(0,1fr);gap:22px;align-items:center}
.detail .bigemoji{font-size:clamp(90px,11vw,140px);background:var(--soft);border-radius:28px;padding:20px;line-height:1}
.wordline{font-family:var(--display);font-weight:700;font-size:clamp(40px,5vw,60px);display:flex;align-items:center;gap:14px;flex-wrap:wrap;line-height:1}
.ex{font-size:22px;line-height:1.45;color:var(--ink-soft);display:flex;align-items:center;gap:10px}
.ex b{color:var(--ink)}
.wchips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.wchip{background:var(--soft);border-radius:999px;padding:8px 14px;font-family:var(--display);font-weight:600;font-size:20px}
.wchip.an{background:#ffecea}
.chestbox{display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center}
.chestbox .ch{font-size:130px;line-height:1;animation:wiggle .5s 3}
.chestbox h2{font-family:var(--display);font-size:34px;margin:0}
.minis{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.minis .card{width:110px;animation:pop .5s both}

/* cat */

function close(a,b){
  if(a.word===b.word) return true;
  const as=lc(a.syn),bs=lc(b.syn),aa=lc(a.ant),ba=lc(b.ant);
  if(as.includes(b.word)||bs.includes(a.word)) return true;

}

let voice=null;
function pickVoice(){ try{ const vs=speechSynthesis.getVoices();
  voice=vs.find(v=>/en[-_]US/i.test(v.lang)&&/google/i.test(v.name))||vs.find(v=>/en[-_]US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null; }catch(e){} }

let ac=null;
function tone(seq){ try{ ac=ac||new (window.AudioContext||window.webkitAudioContext)(); let t=ac.currentTime;
  seq.forEach(([f,d])=>{ const o=ac.createOscillator(),g=ac.createGain(); o.type='triangle'; o.frequency.value=f; g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.18,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+d); o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+d+.02); t+=d*.8; }); }catch(e){} }
const ding=()=>tone([[660,.12],[880,.12],[1175,.22]]);
const bonk=()=>tone([[300,.15],[220,.25]]);
const fanfare=()=>tone([[523,.14],[659,.14],[784,.14],[1047,.4]]);
function tick(){ try{ ac=ac||new (window.AudioContext||window.webkitAudioContext)(); const t=ac.currentTime;
  const o=ac.createOscillator(),g=ac.createGain(); o.type='square'; o.frequency.setValueAtTime(1900,t); o.frequency.exponentialRampToValueAtTime(900,t+.04);
  g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.12,t+.002); g.gain.exponentialRampToValueAtTime(.0001,t+.05); o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+.06);
  const o2=ac.createOscillator(),g2=ac.createGain(); o2.type='sine'; o2.frequency.value=1320; g2.gain.setValueAtTime(.0001,t+.05); g2.gain.exponentialRampToValueAtTime(.1,t+.06); g2.gain.exponentialRampToValueAtTime(.0001,t+.2); o2.connect(g2); g2.connect(ac.destination); o2.start(t+.05); o2.stop(t+.22); }catch(e){} }
const coinSnd=()=>{ coinHit(0,.08,2300); coinHit(.09,.08,2900); };
/* metallic coin: inharmonic partials with a fast decay */
function coinHit(at,vol,f0){ try{ ac=ac||new (window.AudioContext||window.webkitAudioContext)(); const t=ac.currentTime+(at||0); f0=f0||(2000+Math.random()*900); vol=vol||.07;
  [[1,1,.5],[2.76,.55,.32],[5.4,.3,.18],[8.93,.15,.1]].forEach(([m,a,d])=>{ const o=ac.createOscillator(),g=ac.createGain(); o.type='sine'; o.frequency.value=f0*m;
    g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol*a,t+.003); g.gain.exponentialRampToValueAtTime(.0001,t+d); o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+d+.02); });
  const n=ac.createBufferSource(), b=ac.createBuffer(1,Math.floor(ac.sampleRate*.025),ac.sampleRate), dd=b.getChannelData(0); for(let k=0;k<dd.length;k++) dd[k]=(Math.random()*2-1)*(1-k/dd.length);
  const f=ac.createBiquadFilter(); f.type='highpass'; f.frequency.value=6000; const ng=ac.createGain(); ng.gain.value=vol*.6; n.buffer=b; n.connect(f); f.connect(ng); ng.connect(ac.destination); n.start(t); }catch(e){} }
function clink(){ coinHit(0,.06); }
/* coins landing on the pile: a jingle of several coins */
function saveSnd(){ for(let i=0;i<7;i++) coinHit(i*.045+Math.random()*.03, .05+Math.random()*.03, 1700+Math.random()*1400); }

/* ================= TODAY PATH ================= */
function owned(id){ return !!S.cards[id]; }
function reviewPick(n, exclude){
  const day=dayNum();
  return Object.entries(S.cards).filter(([id,c])=>BYID[id]&&!exclude.includes(id)&&c.tier<3&&(day-(c.rev||0))>=REVIEW_GAP[c.tier])
    .sort((a,b)=>(a[1].rev||0)-(b[1].rev||0)).slice(0,n).map(x=>x[0]);
}
function newPath(){
  const L=LESSONS.find(l=>!S.done.includes(l.id));
  let words=L?L.words.slice():[];
  const book=WORDS.filter(w=>w.book&&!owned(w.id)).map(w=>w.id).concat(PRIO.map(x=>BYW[x]).filter(w=>w&&!w.book&&!owned(w.id)&&!words.includes(w.id)).map(w=>w.id));
  words=words.concat(book);
  let rev=reviewPick(L?Math.max(0,Math.min(3,15-words.length)):12, words);
  if(!L && !rev.length) rev=shuffle(Object.keys(S.cards)).slice(0,12);
  const all=words.concat(rev);
  return {date:dateStr(), lesson:L?L.id:null, words:all, fresh:all.filter(id=>!owned(id)), stage:0, chest:false, earned:0, justStage:0};
}
function ensureToday(){
  const d=dateStr();
  if(S.today && !S.today.chest){ S.today.date=d; save(); return; }
  if(S.today && S.today.chest && S.today.date===d) return;
  S.today=newPath(); save();
}
const TW=()=>S.today.words.map(id=>BYID[id]).filter(Boolean);
function stagesLeft(){ return S.today.chest?0:(4-S.today.stage); }

function addCoins(n, cb){
  const pill=$('#coinpill');
  const b=document.createElement('div'); b.className='burst';
  b.innerHTML=`<div class="amt">+${n} 🪙</div>`; document.body.appendChild(b);
  coinSnd();
  const r=pill?pill.getBoundingClientRect():{left:innerWidth-80,top:20,width:60,height:40};
  const tx=r.left+r.width/2, ty=r.top+r.height/2;
  const k=Math.min(14,Math.max(5,Math.round(n/2)));
  for(let i=0;i<k;i++){ const c=document.createElement('div'); c.className='cn'; c.textContent='🪙';
    c.style.left=(innerWidth/2-22+(Math.random()*240-120))+'px'; c.style.top=(innerHeight/2-22+(Math.random()*160-80))+'px';
    b.appendChild(c);
    setTimeout(()=>{ const cr=c.getBoundingClientRect(); c.style.transform=`translate(${tx-cr.left-22}px,${ty-cr.top-22}px) scale(.5)`; c.style.opacity='.2'; }, 500+i*60);
    setTimeout(clink, 1250+i*60);
  }
  const start=S.coins; S.coins+=n; save();
  setTimeout(()=>{ let v=start; const step=Math.max(1,Math.round(n/15));
    const iv=setInterval(()=>{ v=Math.min(S.coins,v+step); const p=$('#coinpill'); if(p){ p.querySelector('span').textContent=v; p.classList.remove('bump'); void p.offsetWidth; p.classList.add('bump'); } if(v>=S.coins){ clearInterval(iv); } }, 50); }, 1100);
  setTimeout(saveSnd, 1350+k*60);
  setTimeout(()=>{ b.remove(); cb&&cb(); }, 2100);
}

function setTask(k,i,mode){ // mode: 'c' toggle done, 'x' toggle no-diary

  save(); return {added:j<0, nowDone:!was&&dayComplete(parseD(k))};
}

let cur=null;
function nextQ(){
  if(run.i>=run.makers.length) return roundEnd();

  const s=STAGES[run.n-1];
  app.innerHTML=`<div class="screen">${qtop()}<div class="panel">
    <div class="qlabel"><span class="tag">${s.en}</span><span class="tag ko">${cur.label||s.ko}</span><span class="tag" style="background:transparent">${run.i+1} / ${run.makers.length}</span>

    <div class="opts ${cur.layout||''} ${cur.dm?'dm':''}">${cur.opts.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o.label)}${o.say?`<span class="os" data-say="${esc(o.say)}" role="button" aria-label="Listen">🔊</span>`:''}</button>`).join('')}</div>
    <div id="fbwrap"></div></div></div>`;
  bindQtop(); bindSay();
  const kh=$('#kohint'); if(kh) kh.onclick=()=>{ kh.textContent='🇰🇷 '+cur.w.ko; };
  const pk=$('#peek'); if(pk) pk.onclick=()=>showStory(false);
  $$('.opt').forEach(b=>b.onclick=e=>{ if(e.target.closest('.os')) return; answer(+b.dataset.i); });

function answer(i){
  if(cur.answered) return; cur.answered=true;
  const o=cur.opts[i], ok=o.ok, w=cur.w;
  const sec=Math.min((Date.now()-shownAt)/1000,90);
  const d=S.days[dateStr()]||(S.days[dateStr()]={q:0,c:0,sec:0}); d.q++; d.sec+=sec; if(ok)d.c++;
  if(run.round===1){ const k='s'+run.n; const ts=S.types[k]||(S.types[k]=[0,0]); ts[1]++; if(ok)ts[0]++; }
  if(w){ if(ok) S.right[w.id]=(S.right[w.id]||0)+1; else S.wrong[w.id]=(S.wrong[w.id]||0)+1; }
  if(ok) run.correct++; else run.wrong.push(run.makers[run.i]);
  save();
  $$('.opt').forEach((b,j)=>{ const oj=cur.opts[j]; if(oj.ok) b.classList.add('right'); else if(j===i) b.classList.add('wrong'); else b.classList.add('dim'); });
  const bl=$('#bl'); if(bl&&w) bl.textContent=w.word;
  let extra='', sayAfter='', defs='';
  const right=cur.opts.find(x=>x.ok);
  const rl = run.n===1 ? w.word : right.label;
  if(w){ extra=`<div class="em">${pic(w)}</div>`;
    const rows=[]; const add=(x,tag)=>{ if(!x||rows.some(r=>r.x===x)) return; const df=defOf(x); if(df) rows.push({x,df,tag}); };
    add(w.word,'');
    if(run.n===2) add(right.word, w.q2.t==='s'?'같은 뜻':'반대 뜻');
    if(o.word&&o.word!==w.word&&!(run.n===2&&o.ok)) add(o.word, ok?'':'내가 고른 단어');
    defs=`<div class="defs">${rows.map(r=>`<div class="drow"><button class="sm" data-say="${esc(r.x+'. '+r.df)}">🔊</button><div>${run.n===1&&BYW[r.x]&&BYW[r.x].pic?BYW[r.x].em+' ':''}<b>${esc(r.x)}</b>${r.tag?` <span class="dtag">${r.tag}</span>`:''}<div class="dd">${esc(r.df)}</div></div></div>`).join('')}</div>`;
    sayAfter=rows.map(r=>`${r.x}: ${r.df}.`).join(' ');
  }
  $('#fbwrap').innerHTML=`<div class="fb ${ok?'good':'bad'}">${extra}
    <div class="msg">${ok?`<div class="big">${rnd(['Great!','Awesome!','You got it!','Super!','Yes!'])}</div>`:`<div class="big">Nice try!</div><div>The answer is <b>${esc(rl)}</b>.${w?` <span class="ko">${esc(w.ko)}</span>`:''} 이따가 다시 풀어요.</div>`}
    ${w?`<div style="margin-top:4px;color:var(--ink-soft)">${sentHTML(w)}</div>${defs}`:''}</div>
    <button class="next" id="nx">Next →</button></div>`;
  bindSay($('#fbwrap'));
  if(ok) ding(); else bonk();
  setTimeout(()=>speak(ok?(sayAfter||'Great!'):('The answer is '+rl+'. '+(sayAfter||''))),400);
  $('#nx').onclick=()=>{ run.i++; nextQ(); };
  $('#fbwrap').scrollIntoView({block:'nearest'});
}
function roundEnd(){
  const tot=run.makers.length, c=run.correct, s=STAGES[run.n-1];
  const allRight=run.wrong.length===0;
  const msg = allRight ? (run.round===1?'Perfect! 한 번에 다 맞혔어요!':'All correct! 다 맞혔어요!') : (c/tot>=.7?'Great job! 거의 다 왔어요!':'Good try! 다시 해 봐요!');
  const wrongWords=run.wrong.map(m=>{ const q=m(); return q.w?q.w.word:'Q'; });
  app.innerHTML=`<div class="screen">${qtop()}<div class="panel"><div class="score">
     <div style="font-size:24px;color:var(--ink-soft)">Step ${run.n} · ${s.en}${run.round>1?' · 다시하기':''}</div>
     <div class="num">${c}<small> / ${tot}</small></div>
     <h2>${tot}개 중 ${c}개 맞혔어요!</h2>
     <div style="font-size:22px">${msg}</div>
     ${allRight?'':`<div class="wlist">${run.n===4?run.wrong.map((_,i)=>`<span>❓ 문제 ${i+1}</span>`).join(''):wrongWords.map(x=>`<span>${esc(x)}</span>`).join('')}</div>`}
     <div class="row" style="justify-content:center">
       ${allRight?`<button class="big-btn green" id="claim">🪙 +${s.coins} 받기!</button>`:`<button class="big-btn" id="retry">🔁 틀린 것 다시하기 (${run.wrong.length})</button><button class="big-btn ghost" id="later">나중에</button>`}
     </div></div></div></div>`;
  bindQtop(); bindSay();
  speak(`You got ${c} out of ${tot}! ${allRight?'Perfect!':'Let\'s try the wrong ones again.'}`);
  if(allRight){ fanfare(); $('#claim').onclick=()=>completeStage(run.n); }
  else { $('#retry').onclick=()=>{ run.makers=shuffle(run.wrong); run.wrong=[]; run.i=0; run.correct=0; run.round++; nextQ(); };
         $('#later').onclick=()=>{ run=null; home(); }; }
}
function completeStage(n){
  const s=STAGES[n-1]; const from=S.today.stage;
  S.today.stage=Math.max(S.today.stage,n); S.today.earned+=s.coins; save();

function openChest(){
  const T=S.today, day=dayNum();
  const got=[], up=[];
  T.words.forEach(id=>{ const c=S.cards[id];
    if(!c){ S.cards[id]={tier:0,got:dateStr(),rev:day}; got.push(id); }
    else { if(c.rev!==day||!T.fresh.includes(id)){ const old=c.tier; c.tier=Math.min(3,c.tier+1); c.rev=day; if(c.tier>old) up.push(id); } } });
  if(T.lesson && !S.done.includes(T.lesson)) S.done.push(T.lesson);
  T.chest=true;
  const total=Object.keys(S.cards).length; let bonus=0;
  while(Math.floor(total/MILESTONE)>S.milestone){ S.milestone++; bonus+=MILESTONE_COINS; }
  const today=dateStr();
  if(S.lastDay!==today){ const y=new Date(); y.setDate(y.getDate()-1); S.streak=(S.lastDay===dateStr(y))?(S.streak||0)+1:1; S.lastDay=today; }
  save();
  const m=document.createElement('div'); m.className='modal';
  m.innerHTML=`<div class="sheet"><div class="chestbox">
     <div class="ch" id="ch">🎁</div>
     <h2>Treasure open! 보물상자가 열렸어요!</h2>
     ${got.length?`<div style="font-size:20px">새 카드 <b>${got.length}장</b>이 도감에 들어갔어요!</div><div class="minis">${got.map((id,i)=>bookCard(BYID[id]).replace('class="card','style="animation-delay:'+(i*.08)+'s" class="card')).join('')}</div>`:''}
     ${up.length?`<div style="font-size:20px">복습 카드 테두리가 올라갔어요! 🥉→🥈→🥇→🌈</div><div class="minis">${up.map(id=>bookCard(BYID[id])).join('')}</div>`:''}
     ${bonus?`<div class="hint" style="font-size:20px">🎉 카드 ${S.milestone*MILESTONE}장 달성! 보너스 +${bonus}🪙</div>`:''}
     <div class="row" style="justify-content:center"><button class="big-btn green" id="ok">🐱 ${esc(S.cat.name)}에게 자랑하기</button><button class="big-btn ghost" id="ok2">닫기</button></div>
   </div></div>`;
  document.body.appendChild(m);
  fanfare(); speak('Treasure open! You got new cards!');
  setTimeout(()=>{ const c=$('#ch'); if(c) c.textContent='✨'; }, 1500);
  const fin=dest=>{ m.remove(); if(dest==='cat'){ catRoom({celebrate:true}); } else home(); };
  addCoins(CHEST_COINS+bonus, ()=>{});
  $('#ok').onclick=()=>fin('cat'); $('#ok2').onclick=()=>fin('home');
}

function ensureWish(){

  const r=Math.random(); let w;
  if(items.length && r<.6) w={k:'item', id:rnd(items).id};

  c.wish=w; save();
}

}
function catAnim(k){ const s=$('#scat'); if(!s) return; s.classList.remove('hop','run','climb'); void s.offsetWidth; s.classList.add(k); setTimeout(()=>s.classList.remove(k), k==='run'?2700:2000); }
function hearts(n,ch){ const r=$('#room'); if(!r) return; for(let i=0;i<n;i++){ const h=document.createElement('span'); h.className='float'; h.textContent=ch||rnd(['💗','💖','✨','💕']); h.style.left=(35+Math.random()*30)+'%'; h.style.bottom=(30+Math.random()*25)+'%'; h.style.animationDelay=(i*.15)+'s'; r.appendChild(h); setTimeout(()=>h.remove(),2400); } }
function refreshCat(){ catRoom({quiet:true}); }
function feedCat(k){
  const c=S.cat; const nm={food:'밥이',fish:'생선 간식이',milk:'우유가'}[k];
  if(c.inv[k]<1){ speak('We need more. Let\'s go to the shop!'); toast(`${nm} 없어요. 상점에서 사요! 🛍️`); return; }
  if(c.food>=90){ speak("I'm full! Thank you!"); toast('배불러요! 나중에 주세요.'); return; }
  c.inv[k]--; c.food=Math.min(100,c.food+({food:8,fish:4,milk:3})[k]); c.joy=Math.min(100,c.joy+({food:1,fish:3,milk:1})[k]);
  save(); refreshCat(); hearts(3, SHOPBY[k].i); catAnim('hop'); if(wishDone(k)) return; speak(k==='fish'?'Yummy fish! Thank you!':(k==='milk'?'Yummy milk! Thank you!':'Yum yum! Thank you!'));
  if(k==='food' && c.poops<3){ setTimeout(()=>{ c.poops++; save(); if(view==='cat'){ refreshCat(); speak('Oops! I made a poop.'); } }, 1800); }
}
function cleanPoop(){
  const c=S.cat; if(!c.poops){ toast('깨끗해요! ✨'); return; }
  if(c.inv.bag<1){ speak('We need poop bags. Let\'s go to the shop!'); toast('응가 봉투가 없어요. 상점에서 사요!'); return; }
  c.inv.bag--; c.poops--; c.joy=Math.min(100,c.joy+1); save(); refreshCat(); hearts(2,'✨'); speak('All clean! Thank you!');
}
function giveBath(){
  const c=S.cat; if((c.inv.soap||0)<1){ speak('We need soap. Let\'s go to the shop!'); toast('비누가 없어요. 상점에서 사요! 🧼'); return; }
  if((c.clean||0)>=90){ speak("I'm already clean!"); toast('벌써 깨끗해요! ✨'); return; }
  c.inv.soap--; c.clean=Math.min(100,(c.clean||0)+20); c.joy=Math.min(100,c.joy+1); save();
  const r=$('#room'); const tub=document.createElement('div'); tub.className='tub'; tub.textContent='🛁'; r&&r.appendChild(tub);
  speak('Splish splash! Bath time! Scrub, scrub, scrub!');
  let i=0; const iv=setInterval(()=>{ hearts(3,rnd(['🫧','🫧','🧼','✨'])); if(++i>=6){ clearInterval(iv); } },350);
  setTimeout(()=>{ tub.remove(); refreshCat(); catAnim('hop'); hearts(4,'✨'); speak('I am so clean and shiny! Thank you!'); }, 2600);
}
function salon(){
  const c=S.cat; let pick=c.fur||'orange';
  const m=document.createElement('div'); m.className='modal';
  const draw=()=>{ const keep=c.fur; c.fur=pick; const prev=catSVG({size:170,mood:'happy'}); c.fur=keep;
    m.innerHTML=`<div class="sheet" style="align-items:center;text-align:center"><button class="close">✕</button>
      <h2 style="font-family:var(--display);margin:0">✂️ Pet Salon 미용실</h2>
      <div style="font-size:18px">털을 다듬고 빗고, 털 색도 바꿀 수 있어요. 한 번에 🪙 ${SALON_PRICE}</div>
      ${prev}
      <div class="furs">${Object.entries(FURS).map(([k,v])=>`<button class="fur ${k===pick?'on':''}" data-fur="${k}" style="background:${v.f}" aria-label="${v.en}"><span>${v.ko}</span></button>`).join('')}</div>
      <button class="big-btn green" id="go" ${S.coins<SALON_PRICE?'disabled':''}>✂️ 미용 시작! 🪙 ${SALON_PRICE}</button>
      ${S.coins<SALON_PRICE?`<small>코인 ${SALON_PRICE-S.coins}개 더 필요해요</small>`:''}</div>`;
    m.querySelector('.close').onclick=()=>m.remove();
    $$('[data-fur]',m).forEach(b=>b.onclick=()=>{ pick=b.dataset.fur; speak(FURS[pick].en); draw(); });
    $('#go',m).onclick=()=>{ if(S.coins<SALON_PRICE) return; S.coins-=SALON_PRICE; c.fur=pick; c.clean=Math.min(100,(c.clean||0)+15); c.joy=Math.min(100,c.joy+4); save(); m.remove(); refreshCat();
      let i=0; const iv=setInterval(()=>{ hearts(2,rnd(['✂️','✨','💇','🌟'])); if(++i>=5) clearInterval(iv); },300);
      speak(`Snip snip! Brush brush! ${c.name} looks beautiful!`); setTimeout(()=>catAnim('hop'),1500); if(wishDone('salon')) setTimeout(refreshCat,1000); };
  };
  draw(); document.body.appendChild(m); speak('Welcome to the pet salon! Pick a color.');
}
function tapFurn(id){
  const x=SHOPBY[id], c=S.cat, day=dayNum(); if(!x) return;
  c.tapped=c.tapped||{}; const first=c.tapped[id]!==day; c.tapped[id]=day;
  if(first){ c.joy=Math.min(100,c.joy+1); save(); }
  speak(`${x.en}! ${x.say||''}`); catAnim(x.slot==='tower'?'climb':'hop'); hearts(2,x.slot==='tower'?'💗':x.i);
}
function giveMed(){
  const c=S.cat; if(!c.sick){ toast(`${c.name}는 건강해요! 💪`); speak("I'm not sick. I feel great!"); return; }
  if(c.inv.med<1){ speak('We need cold medicine. Let\'s go to the shop!'); toast('감기약이 없어요. 상점에서 사요!'); return; }
  c.inv.med--; c.sick=false; c.joy=Math.min(100,c.joy+3); save(); refreshCat(); catAnim('hop'); hearts(4); speak('I feel better! Thank you!');
}
function pickCard(){
  const ids=Object.keys(S.cards).filter(id=>BYID[id]);
  if(!ids.length){ toast('아직 카드가 없어요. 오늘의 탐험에서 카드를 모아요!'); speak('Find cards on today\'s adventure first!'); return; }
  const m=document.createElement('div'); m.className='modal';
  m.innerHTML=`<div class="sheet"><button class="close">✕</button><h2 style="font-family:var(--display);margin:0">Pick a card! 같이 놀 카드를 골라요</h2>
    <div class="grid">${ids.map(id=>bookCard(BYID[id])).join('')}</div></div>`;
  document.body.appendChild(m);
  m.querySelector('.close').onclick=()=>m.remove();
  $$('.card[data-id]',m).forEach(b=>b.onclick=()=>{ m.remove(); playCard(b.dataset.id); });
}
function playCard(id){
  const w=BYID[id], c=S.cat, day=dayNum(); if(!w) return;
  const first=c.played[id]!==day; c.played[id]=day;
  c.joy=Math.min(100,c.joy+(first?3:1)); save();
  const r=$('#room'); if(!r) return;
  const f=document.createElement('div'); f.className='flycard'; f.innerHTML=`<div style="display:flex;flex-direction:column;align-items:center;gap:4px;background:#fff;border-radius:20px;padding:12px 18px;box-shadow:0 6px 0 rgba(0,0,0,.1)"><span>${pic(w)}</span><span style="font-family:var(--display);font-size:30px">${esc(w.word)}</span></div>`;
  r.appendChild(f);
  speak(`${w.word}! ${filled(w)}`);
  catAnim('run'); setTimeout(()=>{ hearts(6); catAnim('hop'); }, 2600);
  setTimeout(()=>{ f.remove(); refreshCat(); toast(first?`${c.name} 기분 +3 💗`:`${c.name} 기분 +1 💗`); }, 4200);
}
function shop(tab){
  view='shop'; tab=tab||'care'; const c=S.cat;
  const items=SHOP.filter(x=>x.cat===tab);
  const card=x=>{
    let btn;
    if(x.inv){ btn=`<button class="buy" data-buy="${x.id}" ${S.coins<x.price?'disabled':''}>🪙 ${x.price} 사기</button><small>가지고 있음: ${c.inv[x.inv]}</small>`; }
    else if(c.owned.includes(x.id)){ const on=c.wear[x.slot]===x.id; btn=`<button class="buy ${on?'off':'wear'}" data-wear="${x.id}">${on?'벗기기':'입히기 / 놓기'}</button>`; }
    else if(x.cat==='special') btn=`<small class="lockgift">🔒 일주일 선물상자</small>`;
    else btn=`<button class="buy" data-buy="${x.id}" ${S.coins<x.price?'disabled':''}>🪙 ${x.price} 사기</button>${S.coins<x.price?`<small>코인 ${x.price-S.coins}개 더 필요해요</small>`:''}`;
    return `<div class="item ${c.owned.includes(x.id)?'own':''} ${x.cat==='special'&&!c.owned.includes(x.id)?'lock':''} ${c.wish&&c.wish.k==='item'&&c.wish.id===x.id?'wished':''}"><div class="i">${x.slot==='tower'?towerSVG(x.color):x.i}</div><b>${esc(x.en)}</b><small>${esc(x.ko)}</small><button class="sm" data-say="${esc(x.en)}">🔊</button>${btn}</div>`;
  };
  app.innerHTML=`<div class="screen">${topbar()}
    <div class="tabs">${SHOPCATS.map(t=>`<button class="tab ${t.id===tab?'on':''}" data-t="${t.id}">${t.i} ${t.en} <small>${t.ko}</small></button>`).join('')}</div>
    <div class="catroom" style="grid-template-columns:minmax(0,1fr) 260px">
      <div class="panel"><div class="shopgrid">${items.map(card).join('')}</div></div>
      <div class="catside" style="align-items:center"><div id="scat2">${catSVG({size:200})}</div><h2>${esc(c.name)}</h2><button class="big-btn blue" id="back">🐱 방으로</button></div>
    </div></div>`;
  bindTop(); bindSay();
  $$('.tab').forEach(b=>b.onclick=()=>shop(b.dataset.t));
  $('#back').onclick=()=>catRoom();
  $$('[data-buy]').forEach(b=>b.onclick=()=>{ const x=SHOPBY[b.dataset.buy]; if(S.coins<x.price) return;
    S.coins-=x.price; if(x.inv) c.inv[x.inv]+=x.n; else { c.owned.push(x.id); c.wear[x.slot]=x.id; }
    save(); coinSnd(); speak(`You bought ${x.en}!`); toast(`${x.ko} 샀어요! 🛍️`);
    if(!x.inv && wishDone('item',x.id)){ setTimeout(()=>catRoom({quiet:true}),300); return; } shop(tab); });
  $$('[data-wear]').forEach(b=>b.onclick=()=>{ const x=SHOPBY[b.dataset.wear]; if(c.wear[x.slot]===x.id) delete c.wear[x.slot]; else c.wear[x.slot]=x.id; save(); shop(tab); });
}

/* ================= REPORT ================= */
const pct=(c,q)=>q?Math.round(c/q*100)+'%':'–';
const mins=s=>(s>0&&s<60)?'1분 미만':Math.round(s/60)+'분';
const SKO={s1:'1단계 그림·뜻',s2:'2단계 같은·반대',s3:'3단계 빈칸',s4:'4단계 이야기'};
function rdata(){
  const last7=[]; for(let i=6;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-i); const k=dateStr(d); last7.push(Object.assign({k,lab:(d.getMonth()+1)+'/'+d.getDate()},{q:0,c:0,sec:0},S.days[k]||{})); }
  const today=last7[6], wk=last7.reduce((a,x)=>({q:a.q+x.q,c:a.c+x.c,sec:a.sec+x.sec}),{q:0,c:0,sec:0});
  const wrong=Object.entries(S.wrong).filter(([id])=>BYID[id]).sort((a,b)=>b[1]-a[1]).slice(0,12).map(([id,n])=>({w:BYID[id],n,r:S.right[id]||0}));
  const tiers=[0,0,0,0]; Object.values(S.cards).forEach(c=>tiers[c.tier]++);
  return {last7,today,wk,wrong,tiers};
}
function reportText(){
  const r=rdata(); const T=S.today;
  let t=`[Word Explorer 리포트 ${dateStr()}]\n`;
  t+=`오늘: ${r.today.q}문제, 정답률 ${pct(r.today.c,r.today.q)}, ${mins(r.today.sec)} · 오늘의 길 ${T&&T.chest?'완료':(T?T.stage+'/4단계':'-')}\n`;
  t+=`최근 7일: ${r.wk.q}문제, 정답률 ${pct(r.wk.c,r.wk.q)}, ${mins(r.wk.sec)}\n`;
  t+=`첫 시도 정답률: `+['s1','s2','s3','s4'].map(k=>`${SKO[k]} ${S.types[k]?pct(S.types[k][0],S.types[k][1]):'–'}`).join(', ')+'\n';
  t+=`카드 ${Object.keys(S.cards).length}장 (동${r.tiers[0]} 은${r.tiers[1]} 금${r.tiers[2]} 무지개${r.tiers[3]}) · 끝낸 이야기 ${S.done.length}/${LESSONS.length}\n`;
  if(r.wrong.length) t+=`자주 틀린 단어: `+r.wrong.map(x=>`${x.w.word}(${x.w.ko}) ${x.n}회`).join(', ');
  return t;
}
function showReport(){
  view='report'; try{speechSynthesis.cancel();}catch(e){}
  const r=rdata(); const maxQ=Math.max(1,...r.last7.map(x=>x.q)); const T=S.today;
  app.innerHTML=`<div class="screen">${topbar()}
    <div class="panel report">
      <h2>부모 리포트</h2>
      <div class="kpis">
        <div class="kpi"><span>오늘 푼 문제</span><b>${r.today.q}</b><span>정답률 ${pct(r.today.c,r.today.q)} · ${mins(r.today.sec)}</span></div>
        <div class="kpi"><span>오늘의 길</span><b>${T&&T.chest?'완료 🎁':(T?T.stage+' / 4':'–')}</b><span>${T&&T.lesson?esc(LBYID[T.lesson].title):''}</span></div>
        <div class="kpi"><span>최근 7일</span><b>${r.wk.q}</b><span>정답률 ${pct(r.wk.c,r.wk.q)} · ${mins(r.wk.sec)}</span></div>
        <div class="kpi"><span>코인</span><b>🪙 ${S.coins}</b><span></span></div>
        <div class="kpi"><span>모은 카드</span><b>${Object.keys(S.cards).length}</b><span>동${r.tiers[0]} 은${r.tiers[1]} 금${r.tiers[2]} 무지개${r.tiers[3]}</span></div>
      </div>
      <div><h3>최근 7일 (파랑: 푼 문제, 초록: 맞힌 문제)</h3>
        <div class="week">${r.last7.map(x=>`<div class="d"><span>${x.q||''}</span><div style="display:flex;gap:3px;align-items:flex-end;width:100%;justify-content:center;height:90px"><i style="height:${x.q/maxQ*100}%"></i><i class="c" style="height:${x.c/maxQ*100}%"></i></div><span>${x.lab}</span></div>`).join('')}</div></div>
      <div class="tw"><h3>단계별 첫 시도 정답률 (누적)</h3>
        <table class="t"><tr><th>단계</th><th>푼 수</th><th>정답률</th></tr>${['s1','s2','s3','s4'].map(k=>{const v=S.types[k]||[0,0]; return `<tr><td>${SKO[k]}</td><td>${v[1]}</td><td>${pct(v[0],v[1])}</td></tr>`;}).join('')}</table></div>
      <div class="tw"><h3>자주 틀리는 단어</h3>
        ${r.wrong.length?`<table class="t"><tr><th>단어</th><th>뜻</th><th>틀림</th><th>맞힘</th></tr>${r.wrong.map(x=>`<tr><td><b>${esc(x.w.word)}</b></td><td>${esc(x.w.ko)}</td><td>${x.n}</td><td>${x.r}</td></tr>`).join('')}</table>`:'<div class="note">아직 틀린 단어가 없어요.</div>'}</div>
      <div class="row"><button class="pbtn" id="cp">📋 리포트 복사 (카톡에 붙여넣기)</button><button class="pbtn ghost" id="hm2">닫기</button><span class="spacer"></span><button class="pbtn ghost" id="skip">오늘 길 새로 만들기</button><button class="pbtn danger" id="rs">기록 초기화</button></div>
      <div id="extra"></div>
      <div class="note">로고(🧭)를 1.5초 길게 누르면 이 화면이 열려요. 기록은 이 태블릿의 브라우저에만 저장돼요.</div>
    </div></div>`;
  bindTop();
  $('#hm2').onclick=home;
  $('#cp').onclick=()=>{ const t=reportText();
    const fb=()=>{ $('#extra').innerHTML=`<div class="note">자동 복사가 안 돼서 아래 글을 길게 눌러 복사해 주세요.</div><textarea class="copy" id="ta" readonly>${esc(t)}</textarea>`; const ta=$('#ta'); ta.focus(); ta.select(); };
    try{ navigator.clipboard.writeText(t).then(()=>toast('복사했어요. 카톡에 붙여넣기 하세요.'),fb); }catch(e){ fb(); } };
  $('#skip').onclick=()=>{ $('#extra').innerHTML=`<div class="fb bad"><div class="msg">지금 진행 중인 오늘의 길을 버리고, 다음 단어 묶음으로 새로 시작할까요? (카드·코인은 그대로예요)</div><button class="pbtn danger" id="sy">새로 만들기</button><button class="pbtn ghost" id="sn">취소</button></div>`;
    $('#sy').onclick=()=>{ if(S.today&&S.today.lesson&&!S.done.includes(S.today.lesson)) S.done.push(S.today.lesson); S.today=newPath(); save(); toast('새 길을 만들었어요.'); home(); }; $('#sn').onclick=()=>{$('#extra').innerHTML='';}; };
  $('#rs').onclick=()=>{ $('#extra').innerHTML=`<div class="fb bad"><div class="msg">정말 모든 기록(카드, 코인, 고양이, 통계)을 지울까요? 되돌릴 수 없어요.</div><button class="pbtn danger" id="rsy">지우기</button><button class="pbtn ghost" id="rsn">취소</button></div>`;
    $('#rsy').onclick=()=>{ S=fresh(); save(); toast('기록을 지웠어요.'); home(); }; $('#rsn').onclick=()=>{$('#extra').innerHTML='';}; };
}

if(location.protocol==='file:') window.__t={cur:()=>cur,S:()=>S,startStage,catRoom,cardBook,save,planView,shop};
home();
setInterval(()=>{ if(view==='cat'){ const old=S.cat.food; tickCat(); } else tickCat(); }, 60000);
})();
</script>
